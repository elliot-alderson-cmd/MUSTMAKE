
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Authentication -->
    <script>
        try {
            const isAuthenticated = Boolean(
                localStorage.getItem("token") &&
                JSON.parse(localStorage.getItem("user") || "null")
            );

            if (isAuthenticated) {
                window.location.replace("/today");
            }
        } catch {
            // Invalid stored authentication data is treated as a guest session.
        }
    </script>

    <!-- Existing project scripts -->
    <script src="/js/core/change_backend_url.js"></script>

    <link rel="icon" type="image/x-icon" href="/assets/images/favicon.jpeg">

    <title>Blog | MUSTMAKE</title>

    <script src="/js/shared/theme.js"></script>

    <link rel="stylesheet" href="/assets/css/style.css">


    <style>

        /* =========================================
           BLOG HERO
        ========================================= */

        .blog-hero {
            text-align: center;
            padding: 80px 0 60px;
            animation: fadeInUp 0.8s ease-out;
        }

        .blog-hero h1 {
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 20px;

            background: linear-gradient(
                135deg,
                #0284c7 0%,
                #ffffff 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .blog-hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.7;
        }


        /* =========================================
           BLOG SECTION
        ========================================= */

        .blog-section {
            margin: 60px 0;
        }

        .blog-page .exercise-section {
            margin-bottom: 40px;
        }

        .blog-page .exercise-section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .blog-page .exercise-section-heading h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            text-transform: capitalize;
        }

        .blog-page .exercise-card {
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            transition: none;
            overflow: hidden;
        }

        .blog-page .exercise-card:hover {
            transform: none;
            border: 0;
            background: transparent;
            box-shadow: none;
        }

        .blog-page .exercise-card-media {
            background: transparent;
            border-radius: 0;
        }

        .blog-page .exercise-media {
            background: transparent;
        }

        .blog-page .exercise-card-link:hover h3 {
            color: inherit;
        }

        .blog-page .exercise-card-content {
            padding: 16px;
            min-height: auto;
        }

        .blog-page .exercise-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
            line-height: 1.4;
            text-align: center;
        }

        :root[data-theme="dark"] body.blog-page .exercise-card,
        :root[data-theme="dark"] body.blog-page .exercise-card:hover {
            border: 0;
            background: transparent;
            box-shadow: none;
            transform: none;
        }

        :root[data-theme="dark"] body.blog-page .exercise-card-media {
            background: transparent;
        }


        /* =========================================
           SECTION TITLE
        ========================================= */

        .section-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        :root[data-theme="dark"] .blog-page #exercises > .section-title .just-highlight {
            color: #9dcae7;
        }

        .section-title::after {
            content: "";
            display: block;
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 15px auto 0;
            border-radius: 2px;
        }


        /* =========================================
           SUNRISE OCEAN CTA
           No card / No border / Seamless background
        ========================================= */
.cta-section {
    position: relative;
    isolation: isolate;
    overflow: hidden;

    display: flex;
    align-items: center;
    justify-content: center;

    min-height: 420px;
    padding: 100px 24px;

    margin: 65px 0;
    text-align: center;

    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
}


        /* =========================================
           SKY AND ATMOSPHERE
        ========================================= */

        .cta-ocean {
            position: absolute;
            inset: 0;
            z-index: 0;

            overflow: hidden;
            pointer-events: none;

            background:
                radial-gradient(
                    ellipse 65% 55% at 50% 36%,
                    rgba(255, 204, 130, 0.24),
                    transparent 78%
                ),
                linear-gradient(
                    180deg,
                    rgba(255, 161, 105, 0.03) 0%,
                    rgba(255, 169, 112, 0.17) 17%,
                    rgba(255, 202, 145, 0.30) 34%,
                    rgba(255, 225, 179, 0.20) 46%,
                    rgba(90, 177, 211, 0.15) 55%,
                    rgba(20, 132, 188, 0.30) 100%
                );

            /* Seamlessly fade into page background */
            -webkit-mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                black 10%,
                black 88%,
                transparent 100%
            );

            mask-image: linear-gradient(
                to bottom,
                transparent 0%,
                black 10%,
                black 88%,
                transparent 100%
            );
        }


        /* Warm atmospheric sunrise glow */

        .cta-ocean::before {
            content: "";
            position: absolute;

            width: 75%;
            height: 55%;

            left: 12.5%;
            top: 12%;

            background: radial-gradient(
                ellipse at center,
                rgba(255, 191, 115, 0.25),
                rgba(255, 155, 100, 0.09) 48%,
                transparent 75%
            );

            filter: blur(35px);

            animation: sunrise-atmosphere 10s ease-in-out infinite;
        }


        /* =========================================
           SUN
        ========================================= */

        .ocean-sun {
            position: absolute;

            width: 76px;
            height: 76px;

            top: 2%;
            left: 50%;

            transform: translateX(-50%);
            border-radius: 50%;

            z-index: 2;

            background: radial-gradient(
                circle,
                #fffde9 0%,
                #fff4c9 30%,
                #ffdf91 65%,
                #ffbd75 100%
            );

            box-shadow:
                0 0 22px rgba(255, 235, 175, 0.75),
                0 0 55px rgba(255, 197, 112, 0.50),
                0 0 110px rgba(255, 157, 90, 0.28);

            animation: sunrise-glow 8s ease-in-out infinite;
        }


        /* =========================================
           OCEAN WATER
        ========================================= */

        .ocean-water {
            position: absolute;

            inset: 40% 0 0;

            z-index: 1;
            overflow: hidden;

            background: linear-gradient(
                180deg,
                rgba(116, 187, 205, 0.18) 0%,
                rgba(50, 159, 201, 0.62) 20%,
                rgba(25, 139, 191, 0.84) 55%,
                rgba(9, 105, 163, 0.90) 100%
            );
        }


        /* Sunlight reflecting on the ocean */

        .ocean-water::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 2;

            background: linear-gradient(
                100deg,
                transparent 15%,
                rgba(255, 239, 197, 0.08) 35%,
                rgba(255, 229, 171, 0.24) 50%,
                rgba(255, 239, 197, 0.08) 65%,
                transparent 85%
            );

            background-size: 200% 100%;

            animation: water-reflection 14s ease-in-out infinite;

            pointer-events: none;
        }


        /* Additional golden sun reflection */

        .ocean-sunlight {
            position: absolute;

            width: 30%;
            height: 75%;

            left: 50%;
            top: 39%;

            transform: translateX(-50%);

            z-index: 3;

            background: linear-gradient(
                180deg,
                rgba(255, 235, 178, 0.38) 0%,
                rgba(255, 215, 147, 0.20) 35%,
                rgba(255, 206, 137, 0.08) 70%,
                transparent 100%
            );

            filter: blur(22px);
            pointer-events: none;
        }


        /* =========================================
           OCEAN WAVES
        ========================================= */

        .wave {
            position: absolute;

            width: 200%;
            height: 100%;
            min-height: 190px;

            left: -50%;
            bottom: -1px;

            overflow: visible;

            will-change: transform;
        }

        .wave path {
            stroke: none;
        }


        /* Wave 1 */

        .wave-one {
            opacity: 0.37;
            animation: wave-motion-one 19s ease-in-out infinite;
        }

        .wave-one path {
            fill: #38bdf8;
        }


        /* Wave 2 */

        .wave-two {
            opacity: 0.34;
            animation: wave-motion-two 25s ease-in-out infinite;
        }

        .wave-two path {
            fill: #7dd3fc;
        }


        /* Wave 3 */

        .wave-three {
            opacity: 0.25;
            animation: wave-motion-three 30s ease-in-out infinite;
        }

        .wave-three path {
            fill: #bae6fd;
        }


        /* Wave 4 */

        .wave-four {
            opacity: 0.16;
            animation: wave-motion-four 36s ease-in-out infinite;
        }

        .wave-four path {
            fill: #e0f2fe;
        }


        /* =========================================
           CTA TEXT
        ========================================= */
.cta-content {
    position: relative;
    z-index: 10;

    width: 100%;
    max-width: 900px;
    margin: auto;
    padding: 0 20px;

    animation: content-float 7s ease-in-out infinite;
}

.cta-section h2 {
    color: #ffffff;
    font-size: clamp(1.5rem, 3.5vw, 2.3rem);
    font-weight: 700;
    line-height: 1.4;

    margin: 0 0 28px;

    text-shadow: 0 2px 15px rgba(0, 35, 65, 0.45);
}

.cta-section .main-button {
    position: relative;
    z-index: 12;
    display: inline-block;
    margin-bottom: 10px;
}

        .cta-section .main-button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 9px 28px rgba(56, 189, 248, 0.22);
        }


        /* =========================================
           ANIMATIONS
        ========================================= */

        /* Floating text */

        @keyframes content-float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-5px);
            }
        }


        /* Sun glow */

        @keyframes sunrise-glow {
            0%, 100% {
                box-shadow:
                    0 0 22px rgba(255, 235, 175, 0.65),
                    0 0 55px rgba(255, 197, 112, 0.4),
                    0 0 110px rgba(255, 157, 90, 0.24);
            }

            50% {
                box-shadow:
                    0 0 32px rgba(255, 245, 205, 0.85),
                    0 0 75px rgba(255, 197, 112, 0.55),
                    0 0 135px rgba(255, 157, 90, 0.32);
            }
        }


        /* Atmospheric light */

        @keyframes sunrise-atmosphere {
            0%, 100% {
                opacity: 0.7;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.08);
            }
        }


        /* Moving sunlight */

        @keyframes water-reflection {
            0%, 100% {
                background-position: 100% 0;
            }

            50% {
                background-position: 0% 0;
            }
        }


        /* Natural ocean movement */

        @keyframes wave-motion-one {
            0%, 100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(-5%, -9px, 0);
            }
        }

        @keyframes wave-motion-two {
            0%, 100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(6%, 7px, 0);
            }
        }

        @keyframes wave-motion-three {
            0%, 100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(-4%, -6px, 0);
            }
        }

        @keyframes wave-motion-four {
            0%, 100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(4%, 5px, 0);
            }
        }


        /* =========================================
           GENERAL ANIMATIONS
        ========================================= */

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

@media (max-width: 768px) {
    .cta-section {
        min-height: 380px;
        padding: 80px 18px;
    }

    .ocean-sun {
        width: 62px;
        height: 62px;
    }
}
        /* =========================================
           RESPONSIVE DESIGN
        ========================================= */

        @media (max-width: 768px) {

            .blog-hero {
                padding: 60px 0 40px;
            }

            .blog-hero h1 {
                font-size: 2rem;
            }

            .blog-hero p {
                font-size: 1rem;
            }

            .blog-page .exercise-section {
                margin-bottom: 32px;
            }

            .blog-page .exercise-section-heading h2 {
                font-size: 1.25rem;
            }

            .blog-page .exercise-card-content {
                padding: 12px;
            }

            .blog-page .exercise-card h3 {
                font-size: 1rem;
            }

            .cta-section {
                min-height: 320px;
                padding: 85px 18px 75px;
                margin: 45px 0;
            }

            .ocean-sun {
                width: 62px;
                height: 62px;
            }

            .ocean-water {
                inset: 48% 0 0;
            }

            .cta-content {
                max-width: 100%;
            }

            .cta-section h2 {
                font-size: clamp(1.5rem, 6vw, 1.9rem);
            }

            .wave {
                min-height: 150px;
            }
        }


        /* =========================================
           ACCESSIBILITY
        ========================================= */

        @media (prefers-reduced-motion: reduce) {

            .blog-hero,
            .cta-content,
            .ocean-sun,
            .cta-ocean::before,
            .wave,
            .ocean-water::before {
                animation: none !important;
            }

            .cta-section .main-button {
                transition: none;
            }
        }

    </style>
</head>


<body class="app-page blog-page">

    <!-- NAVBAR -->

    <div id="navbar"></div>


    <main class="container">


        <!-- =====================================
             BLOG HERO
        ====================================== -->

        <section class="blog-hero">

            <h1>Hardcome to MUSTMAKE</h1>

            <p>You can and you must.</p>

        </section>



        <!-- =====================================
             EXERCISE LIBRARY
        ====================================== -->

        <section id="exercises" class="blog-section">

            <h2 class="section-title">
                It's just <span class="just-highlight">you</span>
            </h2>

            <section
                class="exercise-library"
                aria-label="Exercise library">

                <div
                    id="exerciseGrid"
                    class="exercise-library-groups"
                    aria-live="polite">
                </div>

            </section>

        </section>



        <!-- =====================================
             SUNRISE OCEAN CTA
        ====================================== -->

        <section class="cta-section">

            <!-- Ocean background -->

            <div class="cta-ocean" aria-hidden="true">

                <!-- Rising sun -->

                <div class="ocean-sun"></div>


                <!-- Ocean water -->

                <div class="ocean-water">


                    <!-- First wave -->

                    <svg
                        class="wave wave-one"
                        viewBox="0 0 1440 320"
                        preserveAspectRatio="none">

                        <path d="
                            M0 160
                            C180 100 300 220 480 160
                            S780 100 960 160
                            S1260 220 1440 160

                        "/>

                    </svg>


                    <!-- Second wave -->

                    <svg
                        class="wave wave-two"
                        viewBox="0 0 1440 320"
                        preserveAspectRatio="none">

                        <path d="
                            M0 190
                            C200 120 350 250 540 180
                            S850 110 1050 180
                            S1300 240 1440 170
                            L1440 320 L0 320 Z
                        "/>

                    </svg>


                    <!-- Third wave -->

                    <svg
                        class="wave wave-three"
                        viewBox="0 0 1440 320"
                        preserveAspectRatio="none">

                        <path d="
                            M0 170
                            C160 230 320 100 500 170
                            S820 240 1000 160
                            S1300 100 1440 180
                            L1440 320 L0 320 Z
                        "/>

                    </svg>


                    <!-- Fourth wave -->

                    <svg
                        class="wave wave-four"
                        viewBox="0 0 1440 320"
                        preserveAspectRatio="none">

                        <path d="
                            M0 180
                            C180 130 340 230 520 180
                            S850 120 1030 180
                            S1300 230 1440 170
                            L1440 320 L0 320 Z
                        "/>

                    </svg>

                </div>


                <!-- Sunlight reflection -->

                <div class="ocean-sunlight"></div>

            </div>


            <!-- Floating CTA content -->

            <div class="cta-content">

                <h2>
                    Ready to become stronger with MUSTMAKE?
                </h2>

                <a href="/signup" class="main-button">
                    Get Started
                </a>

            </div>

        </section>


    </main>


    <!-- EXISTING JAVASCRIPT -->

    <script src="/js/shared/navbar.js"></script>

    <script src="/js/features/exercises/exercise-library.js"></script>

</body>
</html>
