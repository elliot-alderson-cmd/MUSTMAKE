
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Authentication -->
    <script>
        try {
            const isAuthenticated = Boolean(
                localStorage.getItem("token") &&
                JSON.parse(localStorage.getItem("user") || "null")
            );

            if (isAuthenticated) {
                window.location.replace("/today");
            }
        } catch {
            // Invalid stored authentication data is treated as a guest session.
        }
    </script>

    <!-- Existing project scripts -->
    <script src="/js/core/change_backend_url.js"></script>

    <link rel="icon" type="image/png" href="/assets/images/favicon.png">

    <title>Blog | MUSTMAKE</title>

    <script src="/js/shared/theme.js"></script>

    <link rel="stylesheet" href="/assets/css/style.css">


    <style>

        /* =========================================
           BLOG HERO
        ========================================= */

        .blog-hero {
            text-align: center;
            padding: 80px 0 60px;
            animation: fadeInUp 0.8s ease-out;
        }

        .blog-hero h1 {
            font-size: clamp(2.5rem, 5vw, 3.5rem);
            font-weight: 700;
            margin-bottom: 20px;

            background: linear-gradient(
                135deg,
                #0284c7 0%,
                #ffffff 100%
            );

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .blog-hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto;
            line-height: 1.7;
        }


        /* =========================================
           BLOG SECTION
        ========================================= */

        .blog-section {
            margin: 60px 0;
        }

        .blog-page .exercise-section {
            margin-bottom: 40px;
        }

        .blog-page .exercise-section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 0 4px;
        }

        .blog-page .exercise-section-heading h2 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
            text-transform: capitalize;
        }

        .blog-page .exercise-card {
            border: 0;
            border-radius: 0;
            background: transparent;
            box-shadow: none;
            transition: none;
            overflow: hidden;
        }

        .blog-page .exercise-card:hover {
            transform: none;
            border: 0;
            background: transparent;
            box-shadow: none;
        }

        .blog-page .exercise-card-media {
            background: transparent;
            border-radius: 0;
        }

        .blog-page .exercise-media {
            background: transparent;
        }

        .blog-page .exercise-card-link:hover h3 {
            color: inherit;
        }

        .blog-page .exercise-card-content {
            padding: 16px;
            min-height: auto;
        }

        .blog-page .exercise-card h3 {
            font-size: 1.1rem;
            font-weight: 600;
            margin: 0;
            line-height: 1.4;
            text-align: center;
        }

        :root[data-theme="dark"] body.blog-page .exercise-card,
        :root[data-theme="dark"] body.blog-page .exercise-card:hover {
            border: 0;
            background: transparent;
            box-shadow: none;
            transform: none;
        }

        :root[data-theme="dark"] body.blog-page .exercise-card-media {
            background: transparent;
        }


        /* =========================================
           SECTION TITLE
        ========================================= */

        .section-title {
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 40px;
            text-align: center;
            position: relative;
        }

        :root[data-theme="dark"] .blog-page #exercises > .section-title .just-highlight {
            color: #9dcae7;
        }

        .section-title::after {
            content: "";
            display: block;
            width: 60px;
            height: 3px;
            background: var(--accent);
            margin: 15px auto 0;
            border-radius: 2px;
        }


        /* =========================================
           VIDEO CTA
        ========================================= */
        .cta-section {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 420px;
            padding: 80px 24px;
            margin: 65px 0;
            text-align: center;
            background: #07131b;
        }

        .cta-video {
            position: absolute;
            inset: 0;
            z-index: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            pointer-events: none;
        }

        .cta-section::before {
            content: "";
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient(
                90deg,
                rgba(4, 10, 18, 0.5),
                rgba(4, 10, 18, 0.28) 50%,
                rgba(4, 10, 18, 0.5)
            );
            pointer-events: none;
        }

        .cta-content {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 900px;
            margin: auto;
            padding: 0 20px;
        }

        .cta-section h2 {
            color: #ffffff;
            font-size: clamp(1.5rem, 3.5vw, 2.3rem);
            font-weight: 700;
            line-height: 1.4;
            margin: 0 0 28px;
            text-shadow: 0 2px 18px rgba(0, 0, 0, 0.7);
        }

        .cta-section .main-button {
            position: relative;
            z-index: 2;
            display: inline-flex;
            margin-bottom: 10px;
        }

        .cta-section .main-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px 28px rgba(56, 189, 248, 0.22);
        }


        /* =========================================
           GENERAL ANIMATIONS
        ========================================= */

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* =========================================
           RESPONSIVE DESIGN
        ========================================= */

        @media (max-width: 768px) {

            .blog-hero {
                padding: 60px 0 40px;
            }

            .blog-hero h1 {
                font-size: 2rem;
            }

            .blog-hero p {
                font-size: 1rem;
            }

            .blog-page .exercise-section {
                margin-bottom: 32px;
            }

            .blog-page .exercise-section-heading h2 {
                font-size: 1.25rem;
            }

            .blog-page .exercise-card-content {
                padding: 12px;
            }

            .blog-page .exercise-card h3 {
                font-size: 1rem;
            }

            .cta-section {
                min-height: 320px;
                padding: 85px 18px 75px;
                margin: 45px 0;
            }

            .cta-content {
                max-width: 100%;
            }

            .cta-section h2 {
                font-size: clamp(1.5rem, 6vw, 1.9rem);
            }

        }


        /* =========================================
           ACCESSIBILITY
        ========================================= */

        @media (prefers-reduced-motion: reduce) {
            .blog-hero {
                animation: none !important;
            }

            .cta-section .main-button {
                transition: none;
            }
        }

    </style>
    <link rel="stylesheet" href="/assets/css/toast.css">
</head>


<body class="app-page blog-page">

    <!-- NAVBAR -->

    <div id="navbar"></div>


    <main class="container">


        <!-- =====================================
             BLOG HERO
        ====================================== -->

        <section class="blog-hero">

            <h1>Hardcome to MUSTMAKE</h1>

            <p>You can and you must.</p>

        </section>



        <!-- =====================================
             EXERCISE LIBRARY
        ====================================== -->

        <section id="exercises" class="blog-section">

            <h2 class="section-title">
                It's just <span class="just-highlight">you</span>
            </h2>

            <section
                class="exercise-library"
                aria-label="Exercise library">

                <div
                    id="exerciseGrid"
                    class="exercise-library-groups"
                    aria-live="polite">
                </div>

            </section>

        </section>



        <!-- =====================================
             VIDEO CTA
        ====================================== -->

        <section class="cta-section">

            <video
                class="cta-video"
                autoplay
                muted
                loop
                playsinline
                preload="metadata"
                aria-hidden="true"
                tabindex="-1"
            >
                <source src="/assets/images/watermov-short.mp4" type="video/mp4">
            </video>


            <!-- CTA content -->

            <div class="cta-content">

                <h2>
                    Ready to become stronger with MUSTMAKE?
                </h2>

                <a href="/signup" class="main-button">
                    Get Started
                </a>

            </div>

        </section>


    </main>


    <!-- EXISTING JAVASCRIPT -->

    <script src="/js/shared/toast.js"></script>
    <script src="/js/shared/navbar.js"></script>

    <script src="/js/features/exercises/exercise-library.js"></script>

</body>
</html>
